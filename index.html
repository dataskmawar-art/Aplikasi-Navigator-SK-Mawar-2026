<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Navigator SK Mawar</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>

        <img src="https://via.placeholder.com/140x140.png?text=LOGO" class="logo">

        <h1>🌸 Navigator SK Mawar 🌸</h1>

        <p>
            Selamat Datang.<br>
            Sila pilih destinasi anda.
        </p>

    </header>

    <div class="menu">

        <button class="btn" onclick="showRoute('Pejabat')">
            🏢 Pejabat
        </button>

        <button class="btn" onclick="showRoute('Bilik Guru')">
            👩‍🏫 Bilik Guru
        </button>

        <button class="btn" onclick="showRoute('Kantin')">
            🍔 Kantin
        </button>

        <button class="btn" onclick="showRoute('Surau')">
            🕌 Surau
        </button>

        <button class="btn" onclick="showRoute('Perpustakaan')">
            📚 Perpustakaan
        </button>

        <button class="btn" onclick="showRoute('Makmal Komputer')">
            💻 Makmal Komputer
        </button>

        <button class="btn" onclick="showRoute('Dewan')">
            🏫 Dewan
        </button>

        <button class="btn" onclick="showRoute('Padang')">
            ⚽ Padang
        </button>

    </div>

    <div id="result" class="result">

        👋 Pilih destinasi di atas.

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
